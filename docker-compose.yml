services:
  veladesk-app:
    container_name: veladesk-app
    image: ghcr.io/unpaved028/veladesk:latest
    restart: always
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      # Must match volume ./data:/app/prisma/data (Prisma file: URLs are relative to prisma/)
      - DATABASE_URL=file:./data/dev.db
    volumes:
      - ./data:/app/prisma/data # Persistente SQLite DB
    networks:
      - veladesk-network

  cloudflared:
    container_name: veladesk-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - veladesk-app
    networks:
      - veladesk-network

networks:
  veladesk-network:
    driver: bridge
